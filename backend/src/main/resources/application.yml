spring:
  application:
    name: kiki-backend
  
  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/kiki_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:kiki_user}
    password: ${DB_PASSWORD:kiki_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  # Mail Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  
  # Web Configuration
  web:
    cors:
      allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
  
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: ${H2_CONSOLE_PATH:/h2-console}
      settings:
        web-allow-others: ${H2_CONSOLE_ALLOW_OTHERS:false}

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# Logging Configuration
logging:
  level:
    com.kiki: ${LOG_LEVEL:INFO}
    org.springframework.mail: ${MAIL_LOG_LEVEL:WARN}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/kiki-backend.log}

# Custom Application Properties
kiki:
  scraping:
    interval: ${SCRAPING_INTERVAL:1800000} # 30 minutes in milliseconds
    retry-attempts: ${RETRY_ATTEMPTS:3}
    retry-delay: ${RETRY_DELAY:1000} # 1 second in milliseconds
    nikke:
      base-url: ${NIKKE_CMS_BASE_URL:https://na-community.playerinfinite.com}
      game-id: ${NIKKE_GAME_ID:16}
      area-id: ${NIKKE_AREA_ID:na}
      source: ${NIKKE_SOURCE:pc_web}
      language: ${NIKKE_LANGUAGE:ko}
      page-size: ${NIKKE_PAGE_SIZE:20}
      max-age-hours: ${NIKKE_MAX_AGE_HOURS:72}
      detail-base-url: ${NIKKE_DETAIL_BASE_URL:https://nikke-kr.com/newsdetail.html}
    wuthering:
      json-base-url: ${WUTHERING_JSON_BASE_URL:https://hw-media-cdn-mingchao.kurogame.com/akiwebsite/website2.0/json/G152}
      locale: ${WUTHERING_LOCALE:kr}
  
  email:
    from: ${EMAIL_FROM:noreply@kiki.com}
    template-path: ${EMAIL_TEMPLATE_PATH:classpath:templates/email/}
  
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  
  games:
    nikke:
      name: "승리의 여신 니케"
      base-url: "https://nikke-kr.com"
      notice-path: "/notice"
    mabinogi-mobile:
      name: "마비노기 모바일"
      base-url: "https://mabinogimobile.nexon.com"
      notice-path: "/news"
    genshin:
      name: "원신"
      base-url: "https://genshin.hoyoverse.com"
      notice-path: "/ko/news"
    wuthering-waves:
      name: "명조"
      base-url: "https://wutheringwaves.kurogames.com"
      notice-path: "/kr/main#news"
